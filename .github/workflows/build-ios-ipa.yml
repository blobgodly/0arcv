name: Build Unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional default Cloud/MongoDB Server URL (e.g. https://your-server.railway.app)'
        required: false
        default: ''

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ github.event.inputs.backend_url || secrets.VITE_API_URL || '' }}
        run: |
          npm run build

      - name: Verify CocoaPods
        run: |
          pod --version

      - name: Initialize or Sync Capacitor iOS
        run: |
          echo "=== Capacitor Info ==="
          npx cap --version || true
          if [ ! -d "ios" ]; then
            echo "Adding iOS platform via Capacitor..."
            npx cap add ios 2>&1 | tee /tmp/cap_add.log || {
              ERROR_MSG=$(tail -n 15 /tmp/cap_add.log | tr '\n' ' ')
              echo "::error title=Capacitor Add Error::$ERROR_MSG"
              cat /tmp/cap_add.log
              exit 1
            }
          fi
          echo "Syncing Capacitor plugins and assets..."
          npx cap sync ios 2>&1 | tee /tmp/cap_sync.log || {
            ERROR_MSG=$(tail -n 15 /tmp/cap_sync.log | tr '\n' ' ')
            echo "::error title=Capacitor Sync Error::$ERROR_MSG"
            cat /tmp/cap_sync.log
            exit 1
          }

      - name: Upload Diagnostic Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-failure-logs
          path: /tmp/cap_*.log

      - name: Configure iOS ATS & Podfile Settings
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Configuring App Transport Security in $PLIST..."
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
            
            # Set display name
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName string '0arc'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '0arc'" "$PLIST"
          fi

          PODFILE="ios/App/Podfile"
          if [ -f "$PODFILE" ]; then
            echo "Configuring Podfile post-install hooks for unsigned build..."
            echo "" >> "$PODFILE"
            echo "post_install do |installer|" >> "$PODFILE"
            echo "  installer.pods_project.targets.each do |target|" >> "$PODFILE"
            echo "    target.build_configurations.each do |config|" >> "$PODFILE"
            echo "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''" >> "$PODFILE"
            echo "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'" >> "$PODFILE"
            echo "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'" >> "$PODFILE"
            echo "      config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'" >> "$PODFILE"
            echo "    end" >> "$PODFILE"
            echo "  end" >> "$PODFILE"
            echo "end" >> "$PODFILE"
            cd ios/App
            pod install
          fi

      - name: Build iOS App without Code Signing
        run: |
          cd ios/App
          
          if [ -d "App.xcworkspace" ]; then
            echo "Building with Xcode Workspace..."
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            echo "Building with Xcode Project..."
            TARGET_FLAG="-project App.xcodeproj"
          fi

          echo "Running xcodebuild with ad-hoc signing..."
          xcodebuild clean build \
            $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../../build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/xcodebuild.log || {
              ERROR_MSG=$(tail -n 20 /tmp/xcodebuild.log | tr '\n' ' ')
              echo "::error title=Xcodebuild Failed::$ERROR_MSG"
              exit 1
            }

      - name: Package Unsigned .ipa Payload
        run: |
          mkdir -p build_ipa/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle in build/DerivedData"
            exit 1
          fi
          
          echo "Found built App at: $APP_PATH"
          cp -R "$APP_PATH" build_ipa/Payload/
          
          cd build_ipa
          zip -r -q ../0arc-unsigned.ipa Payload
          cd ..
          
          echo "Successfully created 0arc-unsigned.ipa"
          ls -lh 0arc-unsigned.ipa

      - name: Upload Unsigned IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0arc-unsigned-ipa
          path: 0arc-unsigned.ipa
          retention-days: 30

      - name: Publish Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 0arc-unsigned.ipa
          generate_release_notes: true

name: Build Unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional default Cloud/MongoDB Server URL (e.g. https://your-server.railway.app)'
        required: false
        default: ''

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ github.event.inputs.backend_url || secrets.VITE_API_URL || '' }}
        run: |
          npm run build

      - name: Verify CocoaPods
        run: |
          pod --version

      - name: Initialize or Sync Capacitor iOS
        run: |
          echo "=== Capacitor Info ==="
          npx cap --version || true
          if [ ! -d "ios" ]; then
            echo "Adding iOS platform via Capacitor..."
            npx cap add ios 2>&1 | tee /tmp/cap_add.log || {
              ERROR_MSG=$(tail -n 15 /tmp/cap_add.log | tr '\n' ' ')
              echo "::error title=Capacitor Add Error::$ERROR_MSG"
              cat /tmp/cap_add.log
              exit 1
            }
          fi
          echo "Syncing Capacitor plugins and assets..."
          npx cap sync ios 2>&1 | tee /tmp/cap_sync.log || {
            ERROR_MSG=$(tail -n 15 /tmp/cap_sync.log | tr '\n' ' ')
            echo "::error title=Capacitor Sync Error::$ERROR_MSG"
            cat /tmp/cap_sync.log
            exit 1
          }

      - name: Configure iOS ATS & Disable Signing in Project & Pods
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Configuring App Transport Security in $PLIST..."
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
            
            # Set display name
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName string '0arc'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '0arc'" "$PLIST"
          fi

          # Switch App project to Manual signing without team requirements
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            echo "Disabling automatic signing in $PBXPROJ..."
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ" 2>/dev/null || true
            sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' "$PBXPROJ" 2>/dev/null || true
          fi

          # Inject unsigned settings into CocoaPods post_install hook safely
          ruby -e '
          file = "ios/App/Podfile"
          exit 0 unless File.exist?(file)
          content = File.read(file)
          hook = "\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"EXPANDED_CODE_SIGN_IDENTITY\"] = \"\"\n      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n    end\n  end\n"
          if content.include?("assertDeploymentTarget(installer)") && !content.include?("CODE_SIGNING_ALLOWED")
            content.sub!("assertDeploymentTarget(installer)", "assertDeploymentTarget(installer)" + hook)
            File.write(file, content)
            puts "Successfully configured Podfile with unsigned settings."
          end
          '
          cd ios/App && pod install

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios/App
          echo "Building iOS Archive via xcodebuild..."
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee /tmp/xcodebuild.log || {
              echo "=== ❌ Xcodebuild Log Tail ==="
              tail -n 80 /tmp/xcodebuild.log
              ERROR_MSG=$(grep -E "(error:|fatal error:)" /tmp/xcodebuild.log | head -n 5 | tr '\n' ' ')
              echo "::error title=Xcodebuild Failure::${ERROR_MSG:-xcodebuild archive failed}"
              exit 1
            }

      - name: Package Unsigned .ipa Payload
        run: |
          mkdir -p build_ipa/Payload
          
          APP_PATH=$(find ios/App/build/App.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ios/App/build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle"
            exit 1
          fi
          
          echo "Found built App at: $APP_PATH"
          cp -R "$APP_PATH" build_ipa/Payload/
          
          cd build_ipa
          zip -r -q ../0arc-unsigned.ipa Payload
          cd ..
          
          echo "Successfully created 0arc-unsigned.ipa"
          ls -lh 0arc-unsigned.ipa

      - name: Upload Unsigned IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0arc-unsigned-ipa
          path: 0arc-unsigned.ipa
          retention-days: 30

      - name: Upload Diagnostic Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic-logs
          path: /tmp/*.log
          retention-days: 7

      - name: Publish Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 0arc-unsigned.ipa
          generate_release_notes: true

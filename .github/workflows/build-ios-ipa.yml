name: Build Unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Optional default Cloud/MongoDB Server URL (e.g. https://your-server.railway.app)'
        required: false
        default: ''

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ github.event.inputs.backend_url || secrets.VITE_API_URL || '' }}
        run: |
          npm run build

      - name: Initialize or Sync Capacitor iOS
        run: |
          echo "=== Capacitor CLI Version ==="
          npx cap --version || true
          if [ ! -d "ios" ]; then
            echo "Adding iOS platform via Capacitor..."
            npx cap add ios
          fi
          echo "Syncing Capacitor plugins and assets..."
          npx cap sync ios

      - name: Configure iOS App Properties
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Configuring App Transport Security and App Name in $PLIST..."
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
            
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName string '0arc'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '0arc'" "$PLIST"
          fi

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios/App
          echo "=== Directory contents of ios/App ==="
          ls -la
          
          if [ -d "App.xcworkspace" ]; then
            TARGET_CONTAINER="-workspace App.xcworkspace"
            echo "Using Xcode Workspace: App.xcworkspace"
          elif [ -d "App.xcodeproj" ]; then
            TARGET_CONTAINER="-project App.xcodeproj"
            echo "Using Xcode Project: App.xcodeproj"
          else
            echo "Error: Neither App.xcworkspace nor App.xcodeproj found in $(pwd)"
            exit 1
          fi

          echo "Building iOS Archive via xcodebuild..."
          xcodebuild clean archive \
            $TARGET_CONTAINER \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package Unsigned .ipa Payload
        run: |
          mkdir -p build_ipa/Payload
          
          APP_PATH=$(find ios/App/build/App.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ios/App/build -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find ios/App -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not locate built .app bundle in archive"
            exit 1
          fi
          
          echo "Found built App at: $APP_PATH"
          cp -R "$APP_PATH" build_ipa/Payload/
          
          cd build_ipa
          zip -r -q ../0arc-unsigned.ipa Payload
          cd ..
          
          echo "Successfully created 0arc-unsigned.ipa"
          ls -lh 0arc-unsigned.ipa

      - name: Upload Unsigned IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0arc-unsigned-ipa
          path: 0arc-unsigned.ipa
          retention-days: 30

      - name: Upload Diagnostic Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            /tmp/*.log
            ios/App/build/*.log

      - name: Publish Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 0arc-unsigned.ipa
          generate_release_notes: true

[package]
name = "zeroarc-server"
version = "0.1.0"
edition = "2021"
authors = ["0arc Team"]
description = "Ultra high-performance Rust backend for 0arc - Personal Digital Archive"

[dependencies]
# Async runtime & Web framework
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-full", "set-header"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Pure-Rust HTTP Client for IMDb, TMDB, TVMaze, Wikipedia
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Security, Crypto & Auth (pure Rust)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
subtle = "2.6"

# Utilities
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
